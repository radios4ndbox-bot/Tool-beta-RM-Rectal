<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12070A">
<meta name="referrer" content="no-referrer">
<title>StructuRad × ESGAR — Chiave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
<style>
/* ══════════════════════════════════════════════════════════════════
   StructuRad × ESGAR — il telefono come chiave
   Conserva solo nome, cognome e titolo di chi referta. Inquadrando il
   QR del PC, conferma l'accesso e manda questi dati, cifrati, al PC.
   Nient'altro passa dal telefono: i referti restano sul PC.
   ══════════════════════════════════════════════════════════════════ */
:root{
  --ink:#12070A; --ink2:#1E0D12; --line:rgba(255,255,255,.09);
  --text:#F3E9EC; --muted:#A8979C; --faint:#76656A;
  --red-light:#EE5A68; --rose:#C42A40; --accent:#7B1E34; --wine:#3A0A14;
  --green:#5FCB8E;
  --molla:cubic-bezier(.34,1.28,.64,1);
  --mono:'IBM Plex Mono', ui-monospace, monospace;
  --sans:'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0; min-height:100%; background:var(--ink); color:var(--text);}
body{
  font-family:var(--sans); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  min-height:100dvh; display:flex; flex-direction:column;
  background:radial-gradient(900px 600px at 50% -10%, #3A0E19 0%, var(--ink) 60%);
  padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px);
}
header{display:flex; align-items:center; gap:10px; padding:18px 4px 6px;}
header svg{width:34px; height:auto; display:block;}
.marchio{font-family:var(--mono); font-size:13px; letter-spacing:.04em;}
.marchio b{font-weight:500; color:var(--red-light);}
main{flex:1; display:flex; flex-direction:column; justify-content:center; gap:14px; max-width:440px; width:100%; margin:0 auto; padding:12px 0;}
.carta{
  position:relative; overflow:hidden;
  background:linear-gradient(160deg, var(--ink2), #150A0E); border:1px solid var(--line); border-radius:18px;
  padding:22px 20px 20px 24px; animation:entra .5s var(--molla) both;
}
.carta::before{content:''; position:absolute; left:0; top:0; bottom:0; width:5px;
  background:linear-gradient(180deg, var(--red-light), var(--rose) 40%, var(--accent) 72%, var(--wine));}
@keyframes entra{from{opacity:0; transform:translateY(10px) scale(.97);} to{opacity:1; transform:none;}}
.kicker{font-size:10px; font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:#EE6B78;}
h1{font-size:22px; font-weight:500; margin:4px 0 6px; letter-spacing:-.01em;}
p{margin:0; color:var(--muted); font-size:14px;}
p b{color:var(--text); font-weight:500;}
.chiave{display:flex; align-items:center; gap:14px; margin-top:16px;}
.av{width:48px; height:48px; border-radius:50%; flex-shrink:0; display:grid; place-items:center;
  font-family:var(--mono); font-size:16px; font-weight:500; color:#fff;
  background:linear-gradient(135deg, var(--red-light), var(--accent));}
.chiave .nome{font-size:17px; font-weight:500;}
.chiave .det{font-family:var(--mono); font-size:11.5px; color:var(--faint); margin-top:2px;}
label{display:block; margin-top:14px;}
label span{display:block; font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:6px;}
input[type=text]{
  width:100%; font-family:var(--sans); font-size:16px; color:var(--text);
  padding:12px 14px; border-radius:10px; border:1.5px solid var(--line); background:rgba(255,255,255,.04); outline:none;
}
input[type=text]:focus{border-color:var(--red-light); background:rgba(255,255,255,.07);}
.titoli{display:flex; gap:8px;}
.titoli button{
  flex:1; font-family:var(--sans); font-size:14px; color:var(--muted); cursor:pointer;
  padding:10px 0; border-radius:10px; border:1.5px solid var(--line); background:transparent;
  transition:all .2s ease;
}
.titoli button.on{color:#fff; border-color:var(--red-light); background:rgba(238,90,104,.14);}
.azioni{display:flex; flex-direction:column; gap:10px; margin-top:20px;}
.btn{
  width:100%; font-family:var(--sans); font-size:16px; font-weight:600; cursor:pointer;
  padding:14px 18px; border-radius:999px; border:1.5px solid transparent;
  transition:transform .2s var(--molla), opacity .2s ease;
}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.55;}
.btn-pieno{color:#fff; background:linear-gradient(135deg, var(--rose), var(--accent)); box-shadow:0 10px 26px -12px rgba(196,42,64,.8);}
.btn-vuoto{color:var(--text); background:transparent; border-color:var(--line);}
.stato{font-size:13.5px; margin-top:14px; color:var(--muted); min-height:1.2em;}
.stato.ok{color:var(--green);}
.stato.ko{color:var(--red-light);}
.spunta{width:64px; height:64px; margin:4px 0 10px;}
.spunta circle{stroke:var(--green); stroke-width:3; fill:none; stroke-dasharray:180; stroke-dashoffset:180; animation:traccia .6s ease forwards;}
.spunta path{stroke:var(--green); stroke-width:4; fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:40; stroke-dashoffset:40; animation:traccia .4s ease .45s forwards;}
@keyframes traccia{to{stroke-dashoffset:0;}}
.codice{margin-top:16px; padding:10px 12px; border-radius:10px; border:1px dashed var(--line); display:flex; justify-content:space-between; align-items:center; gap:10px;}
.codice span{white-space:nowrap; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint);}
.codice b{white-space:nowrap; font-family:var(--mono); font-weight:500; font-size:13px; color:var(--text); letter-spacing:.04em;}
.nota{font-size:12px; color:var(--faint); text-align:center; line-height:1.5; padding:0 10px;}
[hidden]{display:none !important;}
</style>
</head>

<main>
  <!-- creazione della chiave -->
  <section class="carta" id="vCrea" hidden>
    <div class="kicker">Prima volta</div>
    <h1>Crea la tua chiave</h1>
    <label><span>Nome</span><input type="text" id="cNome" autocomplete="given-name" maxlength="40"></label>
    <label><span>Cognome</span><input type="text" id="cCognome" autocomplete="family-name" maxlength="40"></label>
    <label><span>Titolo</span></label>
    <div class="titoli" id="cTitolo" role="radiogroup">
      <button type="button" data-t="Dr." role="radio">Dr.</button>
      <button type="button" data-t="Dr.ssa" role="radio">Dr.ssa</button>
      <button type="button" data-t="" role="radio">Nessuno</button>
    </div>
    <div class="azioni">
      <button type="button" class="btn btn-pieno" id="cSalva">Crea la chiave</button>
      <button type="button" class="btn btn-vuoto" id="cAnnulla" hidden>Annulla</button>
    </div>
    <div class="stato" id="cStato"></div>
  </section>

  <!-- conferma dell'accesso al PC -->
  <section class="carta" id="vAccesso" hidden>
    <div class="kicker">Accesso al PC</div>
    <h1>Accedere a ESGAR su questo PC?</h1>
    <div class="chiave"><div class="av" id="aAv"></div><div><div class="nome" id="aNome"></div><div class="det" id="aDet"></div></div></div>
    <div class="azioni">
      <button type="button" class="btn btn-pieno" id="aConferma">Accedi</button>
      <button type="button" class="btn btn-vuoto" id="aRifiuta">Non sono io / annulla</button>
    </div>
    <div class="stato" id="aStato"></div>
  </section>

  <!-- fatto -->
  <section class="carta" id="vFatto" hidden>
    <svg class="spunta" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28"/><path d="M20 33l8 8 16-17"/></svg>
    <div class="kicker">Fatto</div>
    <h1 id="fTitolo">Accesso effettuato</h1>
    <p id="fTesto">Puoi tornare al PC.</p>
  </section>

  <!-- la chiave, a riposo -->
  <section class="carta" id="vChiave" hidden>
    <div class="kicker">La tua chiave</div>
    <div class="chiave"><div class="av" id="kAv"></div><div><div class="nome" id="kNome"></div><div class="det" id="kDet"></div></div></div>
    <p style="margin-top:16px">Inquadra il QR sul PC.</p>
    <div class="codice"><span>Codice dispositivo</span><b data-codice>…</b></div>
    <div class="azioni"><button type="button" class="btn btn-vuoto" id="kModifica">Modifica i tuoi dati</button></div>
  </section>

</main>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   CANALE CIFRATO PC ↔ TELEFONO (da Protocol Cards, ridotto all'accesso)

   PC e telefono non si vedono in rete: entrambi si collegano IN USCITA a
   un relay pubblico (ntfy.sh) e si scambiano messaggi su un argomento
   segreto. Il relay vede solo testo cifrato.

   L'abbinamento { t, k } (argomento del relay e chiave AES-GCM a 256 bit)
   nasce sul PC e passa al telefono solo nel QR, nel frammento #… che non
   arriva a nessun server. Serve solo per l'accesso: finito quello,
   nessuno dei due lo conserva.

   Busta: { v, da, iv, ct }. Il mittente è dato autenticato, così un
   messaggio del PC non può essere rispedito al PC come se fosse del
   telefono.
   ═══════════════════════════════════════════════════════════════════════ */
(function (root) {
  'use strict';

  let RELAY = 'https://ntfy.sh';        // sostituibile solo dai test, con usaRelay

  const b64u = {
    da: bytes => {
      let s = '';
      const u = new Uint8Array(bytes);
      for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
      return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    },
    a: s => {
      s = s.replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      return Uint8Array.from(atob(s), c => c.charCodeAt(0));
    },
  };

  function casuale(n) {
    const A = 'abcdefghijkmnpqrstuvwxyz23456789';     // niente caratteri ambigui
    return Array.from(crypto.getRandomValues(new Uint8Array(n)), b => A[b % A.length]).join('');
  }

  const RE_ARG = /^esgar-[a-z0-9]{22}$/;
  const valido = a => !!a && RE_ARG.test(a.t || '') && /^[A-Za-z0-9_-]{43}$/.test(a.k || '');

  async function nuovoAbbinamento() {
    const chiave = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
    return { t: 'esgar-' + casuale(22), k: b64u.da(await crypto.subtle.exportKey('raw', chiave)) };
  }

  /* { t, k } dal frammento dell'indirizzo; null se non c'è o è incompleto */
  function daFrammento(hash) {
    const q = new URLSearchParams(String(hash || '').replace(/^#/, ''));
    const a = { t: q.get('t'), k: q.get('k') };
    return valido(a) ? a : null;
  }
  const frammento = a => `#t=${a.t}&k=${a.k}`;

  async function apri(a) {
    if (!valido(a)) throw new Error('abbinamento non valido');
    const chiave = await crypto.subtle.importKey('raw', b64u.a(a.k), 'AES-GCM', false, ['encrypt', 'decrypt']);
    return { argomento: a.t, chiave };
  }

  async function cifra(sess, da, oggetto) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: new TextEncoder().encode(da) },
      sess.chiave, new TextEncoder().encode(JSON.stringify(oggetto)));
    return JSON.stringify({ v: 1, da, iv: b64u.da(iv), ct: b64u.da(ct) });
  }

  async function decifra(sess, testo) {
    const b = JSON.parse(testo);
    if (b.v !== 1 || !b.da || !b.iv || !b.ct) throw new Error('busta sconosciuta');
    const chiaro = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64u.a(b.iv), additionalData: new TextEncoder().encode(b.da) },
      sess.chiave, b64u.a(b.ct));
    return { da: b.da, msg: JSON.parse(new TextDecoder().decode(chiaro)) };
  }

  async function invia(sess, da, oggetto) {
    const corpo = await cifra(sess, da, oggetto);
    const r = await fetch(`${RELAY}/${sess.argomento}`, { method: 'POST', body: corpo, cache: 'no-store' });
    if (!r.ok) throw new Error(r.status === 429 ? 'troppi invii ravvicinati, riprova fra un minuto' : 'relay: HTTP ' + r.status);
  }

  /* ascolto con EventSource, che si riconnette da solo. since=all
     consegna anche quanto arrivato prima dell'apertura; i doppioni della
     riconnessione si scartano per identificativo, i propri messaggi e
     quelli che non si decifrano si ignorano.                          */
  function ascolta(sess, io, { messaggio, stato = () => {} }) {
    const visti = new Set();
    const es = new EventSource(`${RELAY}/${sess.argomento}/sse?since=all`);
    es.onopen = () => stato('aperto');
    es.onerror = () => stato(es.readyState === EventSource.CLOSED ? 'chiuso' : 'riconnessione');
    es.onmessage = async ev => {
      let e; try { e = JSON.parse(ev.data); } catch (_) { return; }
      if (e.event !== 'message' || visti.has(e.id)) return;
      visti.add(e.id);
      let m;
      try { m = await decifra(sess, e.message); } catch (_) { return; }
      if (m.da !== io) messaggio(m.msg);
    };
    return () => es.close();
  }

  /* come il tool chiama chi ha fatto l'accesso: «Dr. Rossi».
     Il titolo lo sceglie l'operatore, non si ricava dal nome.         */
  const TITOLI = ['Dr.', 'Dr.ssa'];
  function nomeCortese(p) {
    if (!p) return '';
    const n = (p.nome || '').trim(), c = (p.cognome || '').trim();
    if (TITOLI.includes(p.titolo) && (c || n)) return `${p.titolo} ${c || n}`;
    return [n, c].filter(Boolean).join(' ');
  }
  const iniziali = p => (((p.nome || '').trim()[0] || '') + ((p.cognome || '').trim()[0] || '')).toUpperCase();

  /* il profilo che il telefono porta al PC: solo i dati d'accesso */
  function profiloValido(p) {
    return !!p && /^op-[a-z0-9]{12}$/.test(p.id || '')
      && typeof p.nome === 'string' && typeof p.cognome === 'string'
      && p.nome.trim().length > 0 && p.cognome.trim().length > 0
      && p.nome.length <= 40 && p.cognome.length <= 40
      && (p.titolo === '' || TITOLI.includes(p.titolo));
  }


  /* ─── identità del dispositivo ─────────────────────────────────────
     Ogni telefono ha una coppia di chiavi ECDSA P-256: la privata nasce
     sul telefono, non esportabile, e non lo lascia mai. A ogni accesso
     il telefono firma argomento del relay e id del profilo; il PC
     verifica con la pubblica. Il codice dispositivo è un'impronta della
     pubblica: è lui, non il nome, a dire chi è l'amministratore.       */
  const testoFirma = (t, id) => `structurad-esgar|accesso|${t}|${id}`;
  async function codiceDispositivo(pub) {
    if (!pub || pub.kty !== 'EC' || pub.crv !== 'P-256' || !pub.x || !pub.y) return '';
    const h = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pub.x + '.' + pub.y)));
    const hex = Array.from(h.slice(0, 8), (b) => b.toString(16).padStart(2, '0')).join('').toUpperCase();
    return hex.match(/.{4}/g).join('-');
  }
  async function verificaFirma(pub, firma, testo) {
    try {
      const k = await crypto.subtle.importKey('jwk', { kty: 'EC', crv: 'P-256', x: pub.x, y: pub.y, ext: true },
        { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
      return await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, k, b64u.a(firma), new TextEncoder().encode(testo));
    } catch (_) { return false; }
  }
  root.Canale = {
    get RELAY() { return RELAY; }, usaRelay: u => { RELAY = u; },
    nuovoAbbinamento, daFrammento, frammento, valido, apri, cifra, decifra, invia, ascolta,
    casuale, TITOLI, nomeCortese, iniziali, profiloValido,
    testoFirma, codiceDispositivo, verificaFirma, b64u,
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function(){
  'use strict';
  const CHIAVE = 'structurad.esgar.chiave';
  const $ = (id) => document.getElementById(id);

  /* La coppia di chiavi del dispositivo: la privata non è esportabile e
     resta in questo browser (IndexedDB). Firma ogni accesso; dalla
     pubblica nasce il codice dispositivo. */
  function idbDisp(){
    return new Promise((ok, ko) => {
      const r = indexedDB.open('structurad-esgar-dispositivo', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('chiavi');
      r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
    });
  }
  async function chiaviDispositivo(){
    const db = await idbDisp();
    const leggi = () => new Promise((ok) => { const r = db.transaction('chiavi').objectStore('chiavi').get('firma'); r.onsuccess = () => ok(r.result || null); r.onerror = () => ok(null); });
    let c = await leggi();
    if (!c) {
      const kp = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign', 'verify']);
      const j = await crypto.subtle.exportKey('jwk', kp.publicKey);
      c = { privata: kp.privateKey, pub: { kty: 'EC', crv: 'P-256', x: j.x, y: j.y } };
      await new Promise((ok) => { const t = db.transaction('chiavi', 'readwrite'); t.objectStore('chiavi').put(c, 'firma'); t.oncomplete = ok; t.onerror = ok; });
    }
    return c;
  }
  async function firma(testo){
    const c = await chiaviDispositivo();
    const sig = await crypto.subtle.sign({ name: 'ECDSA', hash: 'SHA-256' }, c.privata, new TextEncoder().encode(testo));
    return { pub: c.pub, firma: Canale.b64u.da(sig) };
  }
  let codice = '';
  chiaviDispositivo().then((c) => Canale.codiceDispositivo(c.pub)).then((k) => {
    codice = k;
    document.querySelectorAll('[data-codice]').forEach((e) => { e.textContent = k; });
  }).catch(() => {});
  const viste = ['vCrea', 'vAccesso', 'vFatto', 'vChiave'];
  const mostra = (v) => viste.forEach((x) => { $(x).hidden = x !== v; });
  const stato = (id, t, tono) => { const e = $(id); e.textContent = t || ''; e.className = 'stato ' + (tono || ''); };

  // l'abbinamento arriva dal QR nel frammento: si toglie subito dall'indirizzo
  let abb = Canale.daFrammento(location.hash);
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);

  function leggi(){ try { const p = JSON.parse(localStorage.getItem(CHIAVE) || 'null'); return Canale.profiloValido(p) ? p : null; } catch (_) { return null; } }
  function scrivi(p){ localStorage.setItem(CHIAVE, JSON.stringify(p)); }
  let profilo = leggi();
  // il browser non deve cancellare la chiave per fare spazio
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  function dispositivo(){
    const ua = navigator.userAgent;
    if (/iPhone/.test(ua)) return 'iPhone';
    if (/iPad/.test(ua)) return 'iPad';
    const m = ua.match(/Android[^;]*;\s*([^;)]+?)(?:\sBuild|\))/);
    return m ? m[1].trim().slice(0, 40) : /Android/.test(ua) ? 'Android' : 'telefono';
  }

  /* ── creazione e modifica della chiave ── */
  let titolo = '';
  function scegliTitolo(t){
    titolo = t;
    $('cTitolo').querySelectorAll('button').forEach((b) => { const on = b.dataset.t === t; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
  }
  $('cTitolo').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) scegliTitolo(b.dataset.t); });
  function apriCrea(){
    $('cNome').value = profilo ? profilo.nome : '';
    $('cCognome').value = profilo ? profilo.cognome : '';
    scegliTitolo(profilo ? profilo.titolo : 'Dr.');
    $('cSalva').textContent = profilo ? 'Salva' : 'Crea la chiave';
    $('cAnnulla').hidden = !profilo;
    stato('cStato', '');
    mostra('vCrea');
  }
  $('cSalva').addEventListener('click', () => {
    const n = $('cNome').value.trim(), c = $('cCognome').value.trim();
    if (!n || !c) { stato('cStato', 'Servono nome e cognome.', 'ko'); (n ? $('cCognome') : $('cNome')).focus(); return; }
    const p = { id: profilo ? profilo.id : 'op-' + Canale.casuale(12), nome: n.slice(0, 40), cognome: c.slice(0, 40), titolo };
    scrivi(p); profilo = p;
    abb ? apriAccesso() : apriChiave();
  });
  $('cAnnulla').addEventListener('click', () => { abb ? apriAccesso() : apriChiave(); });

  function riempi(av, nome, det){
    $(av).textContent = Canale.iniziali(profilo);
    $(nome).textContent = Canale.nomeCortese(profilo);
    $(det).textContent = `${profilo.nome} ${profilo.cognome}`;
  }
  function apriChiave(){ riempi('kAv', 'kNome', 'kDet'); mostra('vChiave'); }
  $('kModifica').addEventListener('click', apriCrea);

  /* ── accesso al PC ── */
  function apriAccesso(){ riempi('aAv', 'aNome', 'aDet'); stato('aStato', ''); mostra('vAccesso'); }
  $('aRifiuta').addEventListener('click', () => {
    $('fTitolo').textContent = 'Accesso annullato';
    $('fTesto').textContent = 'Il PC non ha ricevuto niente.';
    document.querySelector('#vFatto .spunta').style.display = 'none';
    mostra('vFatto');
  });
  $('aConferma').addEventListener('click', async () => {
    const b = $('aConferma'); b.disabled = true;
    stato('aStato', 'Collegamento al PC…');
    let chiudi = null, finito = false;
    const fine = (ok, testo) => {
      if (finito) return; finito = true;
      clearTimeout(timer); chiudi && chiudi();
      if (ok) {
        $('fTitolo').textContent = 'Accesso effettuato';
        $('fTesto').textContent = testo;
        mostra('vFatto');
      } else { stato('aStato', testo, 'ko'); b.disabled = false; }
    };
    const timer = setTimeout(() => fine(false, 'Il PC non risponde: riprova.'), 25000);
    try {
      const sess = await Canale.apri(abb);
      chiudi = Canale.ascolta(sess, 'tel', {
        messaggio: (m) => {
          if (m && m.tipo === 'benvenuto') {
            const ore = m.scade ? new Date(m.scade).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }) : '';
            fine(true, `${m.nome || Canale.nomeCortese(profilo)}, puoi tornare al PC.` + (ore ? ` L'accesso vale fino alle ${ore}.` : ''));
          }
        }
      });
      const f = await firma(Canale.testoFirma(abb.t, profilo.id));
      await Canale.invia(sess, 'tel', {
        tipo: 'accesso', dispositivo: dispositivo(), pub: f.pub, firma: f.firma,
        profilo: { id: profilo.id, nome: profilo.nome, cognome: profilo.cognome, titolo: profilo.titolo }
      });
      stato('aStato', 'In attesa di conferma dal PC…');
    } catch (e) {
      fine(false, 'Accesso non riuscito: ' + (e instanceof TypeError ? 'rete non raggiungibile' : e.message));
    }
  });

  if (!profilo) apriCrea();
  else if (abb) apriAccesso();
  else apriChiave();

  // un nuovo QR inquadrato con la pagina già aperta cambia solo il
  // frammento: la pagina non si ricarica, quindi si riparte da qui
  window.addEventListener('hashchange', () => {
    const nuovo = Canale.daFrammento(location.hash);
    history.replaceState(null, '', location.pathname + location.search);
    if (!nuovo) return;
    abb = nuovo;
    $('aConferma').disabled = false;
    document.querySelector('#vFatto .spunta').style.display = '';
    profilo ? apriAccesso() : apriCrea();
  });

  /* solo per i test */
  window.EsgarTelefono = { usaRelay: (u) => Canale.usaRelay(u), firma, codice: () => codice };
})();
</script>
