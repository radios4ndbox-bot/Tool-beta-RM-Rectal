# Compila il programma per Windows (installazione per utente, pacchetto
# MSI per macchina da distribuire con SCCM/Intune/GPO, versione portatile) e il programma dimostrativo (portatile, con il tool e i dati
# di esempio dentro) su una macchina Windows di GitHub. I file .exe si scaricano
# dagli «Artifacts» dell'esecuzione; con un tag desktop-v*, o avviando il
# workflow a mano con «rilascia», finiscono anche in una Release
# desktop-v<versione di desktop/package.json>, da cui il programma
# installato si aggiorna.
name: Programma Windows

on:
  push:
    paths: ['desktop/**', 'demo/**', 'index.html', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      rilascia:
        description: 'Pubblica una Release con la versione di desktop/package.json'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: StructuRad-ESGAR-Windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.msi
          if-no-files-found: error
      - id: versione
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.rilascia
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('desktop-v{0}', steps.versione.outputs.v) }}
          target_commitish: ${{ github.sha }}
          name: StructuRad ESGAR ${{ steps.versione.outputs.v }}
          make_latest: true
          # latest.yml e .blockmap servono al programma installato per aggiornarsi
          files: |
            desktop/dist/*.exe
            desktop/dist/*.msi
            desktop/dist/*.blockmap
            desktop/dist/latest.yml

  demo:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # la demo usa Electron ed electron-builder del programma del reparto
      - run: npm ci
        working-directory: desktop
      - run: ..\desktop\node_modules\.bin\electron-builder --win portable --publish never
        working-directory: demo
      - uses: actions/upload-artifact@v4
        with:
          name: StructuRad-ESGAR-Demo
          path: demo/dist/*.exe
          if-no-files-found: error
