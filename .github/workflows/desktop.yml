# Compila il programma per Windows (installazione per utente e versione
# portatile) e il programma dimostrativo (portatile, con il tool e i dati
# di esempio dentro) su una macchina Windows di GitHub. I file .exe si scaricano
# dagli «Artifacts» dell'esecuzione; con un tag desktop-v* finiscono
# anche in una Release.
name: Programma Windows

on:
  push:
    paths: ['desktop/**', 'demo/**', 'index.html', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: StructuRad-ESGAR-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          # latest.yml e .blockmap servono al programma installato per aggiornarsi
          files: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml

  demo:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # la demo usa Electron ed electron-builder del programma del reparto
      - run: npm ci
        working-directory: desktop
      - run: ..\desktop\node_modules\.bin\electron-builder --win portable --publish never
        working-directory: demo
      - uses: actions/upload-artifact@v4
        with:
          name: StructuRad-ESGAR-Demo
          path: demo/dist/*.exe
          if-no-files-found: error
